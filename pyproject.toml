[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mitoxy-ccrcc"
version = "2.1.0"
description = "Analysis code and supplementary results for the Mitoxy ccRCC study"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
